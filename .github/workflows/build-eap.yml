name: Build EAP Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-eap:
    name: Build ACAP EAP
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EAP package
        run: ./build.sh

      - name: Collect package metadata
        id: package
        shell: bash
        run: |
          mapfile -t a8_files < <(find . -maxdepth 1 -type f -name '*_artpec8.eap' -printf '%P\n' | sort)
          mapfile -t a9_files < <(find . -maxdepth 1 -type f -name '*_artpec9.eap' -printf '%P\n' | sort)
          if [ "${#a8_files[@]}" -ne 1 ] || [ "${#a9_files[@]}" -ne 1 ]; then
            echo "Expected one ARTPEC-8 and one ARTPEC-9 EAP; found ${#a8_files[@]} and ${#a9_files[@]}." >&2
            exit 1
          fi

          version=$(python3 -c "import json; print(json.load(open('app/manifest.json', encoding='utf-8'))['acapPackageConf']['setup']['version'])")

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=detectx-${version}-eap" >> "$GITHUB_OUTPUT"

      - name: Upload EAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            *.eap
          if-no-files-found: error
          retention-days: 90

  release-eap:
    name: Publish GitHub Release Asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-eap
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download EAP artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-eap.outputs.artifact_name }}
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          expected_tag="v${{ needs.build-eap.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match manifest version ${{ needs.build-eap.outputs.version }}." >&2
            exit 1
          fi

          mapfile -t a8_files < <(find release-assets -maxdepth 1 -type f -name '*_artpec8.eap' | sort)
          mapfile -t a9_files < <(find release-assets -maxdepth 1 -type f -name '*_artpec9.eap' | sort)
          if [ "${#a8_files[@]}" -ne 1 ] || [ "${#a9_files[@]}" -ne 1 ]; then
            echo "Expected one ARTPEC-8 and one ARTPEC-9 release asset; found ${#a8_files[@]} and ${#a9_files[@]}." >&2
            exit 1
          fi

          cp "${a8_files[0]}" release-assets/DetectX_latest_artpec8.eap
          cp "${a9_files[0]}" release-assets/DetectX_latest_artpec9.eap

      - name: Remove stale EAP release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name | endswith(".eap")) | .name' 2>/dev/null || true)
          if [ -z "$assets" ]; then
            exit 0
          fi

          while IFS= read -r asset; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
          done <<< "$assets"

      - name: Publish EAP on GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.eap
          generate_release_notes: true